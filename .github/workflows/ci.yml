name: CI

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # build first: the browser smoke test imports (and typechecks against) the built bundle
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # package-quality gates: publint (exports/ESM), attw (types as consumers
      # resolve them), tarball whitelist guard
      - run: bun run check:package
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read tools/deno-smoke.ts
