name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config-file: .github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          upload: false
          output: codeql-results
        env:
          CODEQL_ACTION_DISABLE_DATABASE_UPLOADS: true

      - name: Display CodeQL results summary
        run: |
          echo "=== CodeQL Analysis Complete ==="
          if [ -f codeql-results/javascript.sarif ]; then
            ISSUES=$(cat codeql-results/javascript.sarif | jq '[.runs[].results[]] | length' 2>/dev/null || echo "?")
            echo "Total issues found: $ISSUES"
            echo ""
            echo "=== All Issues ==="
            cat codeql-results/javascript.sarif | jq -r '.runs[].results[] | "[\(.rule.id)] \(.message.text) @ \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' 2>/dev/null || true
          else
            ls -la codeql-results/ 2>/dev/null || echo "No results directory"
          fi

      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: codeql-sarif
          path: codeql-results/javascript.sarif
          retention-days: 30
          if-no-files-found: ignore
